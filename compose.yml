name: pi-web-container

services:
  pi-web:
    image: ${PI_WEB_IMAGE:-ghcr.io/darknightlab/pi-web-container:main}
    build:
      context: .
      args:
        PI_WEB_REPOSITORY: ${PI_WEB_REPOSITORY:-https://github.com/canoziia/pi-web.git}
        PI_WEB_REF: ${PI_WEB_REF:-main}
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    # ports:
    #   - "${PI_WEB_BIND_ADDR:-127.0.0.1}:${PI_WEB_PORT:-30141}:30141"
    #   - "${PI_WEB_BIND_ADDR:-127.0.0.1}:${PASEO_PORT:-6767}:6767"
    #   - "${NOVNC_PUBLISH_ADDR:-127.0.0.1}:${NOVNC_PORT:-6080}:${NOVNC_PORT:-6080}"
    volumes:
      - ./data/home:/home
