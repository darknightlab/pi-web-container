name: pi-web-container

services:
  pi-web:
    image: ${PI_WEB_IMAGE:-ghcr.io/darknightlab/pi-web-container:latest}
    # Local builds are optional; uncomment to build instead of pulling the cloud image.
    # build:
    #   context: .
    #   args:
    #     PI_WEB_VERSION: ${PI_WEB_VERSION:-latest}
    container_name: pi-web
    restart: unless-stopped
    ports:
      - "${PI_WEB_BIND_ADDR:-127.0.0.1}:${PI_WEB_PORT:-8504}:8504"
    environment:
      HOME: /data/home
      XDG_CONFIG_HOME: /data/config
      PI_WEB_HOST: 0.0.0.0
      PI_WEB_PORT: "8504"
      PI_WEB_DATA_DIR: /data/pi-web
      PI_WEB_SESSIOND_SOCKET: /data/pi-web/sessiond.sock
      PI_CODING_AGENT_DIR: /data/pi-agent
    volumes:
      - ./data:/data
      - ./workspace:/workspace
    working_dir: /workspace
