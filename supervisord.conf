[unix_http_server]
file=/tmp/pi-web-container/supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/pi-web-container/supervisord.pid
childlogdir=/tmp/pi-web-container
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/pi-web-container/supervisor.sock

[program:xvfb]
command=/usr/local/libexec/pi-web-container/service xvfb
priority=10
autostart=true
autorestart=true
startsecs=1
startretries=30
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:fluxbox]
command=/usr/local/libexec/pi-web-container/service fluxbox
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=30
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:pi-web]
command=/usr/local/libexec/pi-web-container/service pi-web
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=30
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[include]
files=/tmp/pi-web-container/supervisor.d/*.conf
